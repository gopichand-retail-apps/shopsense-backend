openapi: 3.1.0
info:
  title: ShopSense API
  version: 1.0.0
  description: Loopback paginated catalog, a version 2 offer projection with store availability, and optional Gemini or Ollama selection. API authentication is not implemented.
servers:
  - url: http://127.0.0.1:5802/api/v1
    description: Loopback-only local API
security: []
paths:
  /version:
    get:
      operationId: getApplicationVersion
      summary: Read the backend artifact version
      responses:
        '200':
          description: API service name and SemVer release from the package manifest.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [service, version]
                    properties:
                      service: { type: string, const: shopsense-api }
                      version: { type: string, pattern: '^\\d+\\.\\d+\\.\\d+$' }
  /health:
    get:
      operationId: getHealth
      summary: Check API and local storage readiness
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Service and selected database readiness.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Trace-ID:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /catalog:
    get:
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
        - in: query
          name: category
          description: Optional category ID from the public content model.
          schema:
            type: string
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - in: query
          name: ids
          description: Up to 50 comma-separated product IDs, for saved/comparison resolution.
          schema: { type: string }
      responses:
        '200':
          description: Catalog products and their stored attributes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Trace-ID:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /search:
    post:
      operationId: searchCatalog
      summary: Search the catalog and return grounded recommendations
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Catalog-grounded matches and matched source details.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Trace-ID:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SearchData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /store-layout:
    get:
      summary: Read the versioned virtual-store aisle and rack guide
      description: Source-controlled virtual layout. This is not a physical retailer or live inventory feed.
      responses:
        '200':
          description: Current virtual-store layout.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, version, name, aisles]
                    properties:
                      id: { type: string }
                      version: { type: integer, minimum: 1 }
                      name: { type: string }
                      aisles:
                        type: array
                        items:
                          type: object
                          required: [id, label, category, racks]
                          properties:
                            id: { type: string }
                            label: { type: string }
                            category: { type: string }
                            audience: { type: string }
                            racks: { type: array, items: { type: string } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /feedback:
    post:
      operationId: submitFeedback
      summary: Record feedback for a catalog item
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback accepted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Trace-ID:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FeedbackData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v2/locations:
    servers:
      - url: http://127.0.0.1:5802/api
        description: Loopback-only local API. Version 2 reads the SQLite offer projection.
    get:
      operationId: listOfferLocations
      summary: List the store locations known to the offer projection
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Store locations in display order.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Trace-ID:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LocationList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/OffersUnsupported'
  /v2/feed-status:
    servers:
      - url: http://127.0.0.1:5802/api
        description: Loopback-only local API. Version 2 reads the SQLite offer projection.
    get:
      operationId: getOfferFeedStatus
      summary: Read offer feed counts and freshness for the staff onboarding page
      description: Read-only and unauthenticated in this local build. It returns counts and timestamps only.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Feed state, counts and freshness watermark.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Trace-ID:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FeedStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/OffersUnsupported'
  /v2/catalog:
    servers:
      - url: http://127.0.0.1:5802/api
        description: Loopback-only local API. Version 2 reads the SQLite offer projection.
    get:
      operationId: browseOffers
      summary: Page published offers, optionally with availability at one store
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
        - in: query
          name: location
          description: Store location ID. Unknown IDs are rejected with INVALID_LOCATION.
          schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,80}$' }
        - in: query
          name: category
          description: Optional category ID from the public content model.
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - in: query
          name: ids
          description: Up to 50 comma-separated product IDs. Withdrawn or unknown IDs are listed in unavailableIds.
          schema: { type: string }
      responses:
        '200':
          description: Published offers, total, unavailable requested IDs and catalog freshness.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Trace-ID:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OfferPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/OffersUnsupported'
  /v2/search:
    servers:
      - url: http://127.0.0.1:5802/api
        description: Loopback-only local API. Version 2 reads the SQLite offer projection.
    post:
      operationId: searchOffers
      summary: Search published offers with store, stock, audience, colour and price constraints applied before ranking
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferSearchRequest'
      responses:
        '200':
          description: Grounded offer matches, assistance mode and catalog freshness.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Trace-ID:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OfferSearchData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/OffersUnsupported'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID; invalid values are replaced by the API.
      schema:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[A-Za-z0-9._:-]{1,80}$'
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Optional W3C trace context; malformed values are replaced by the API.
      schema:
        type: string
        pattern: '^00-[a-fA-F0-9]{32}-[a-fA-F0-9]{16}-[a-fA-F0-9]{2}$'
  headers:
    RequestId:
      description: Correlation ID used by the API for this request.
      schema:
        type: string
    TraceId:
      description: Trace ID used by the API for this request.
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: string
        pattern: '^[0-9]+$'
  responses:
    BadRequest:
      description: Request input is invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        X-Trace-ID:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Supplied browser origin is not allowlisted.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        X-Trace-ID:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Route or catalog product was not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        X-Trace-ID:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeds the configured byte limit.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        X-Trace-ID:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Local API rate limit was exceeded.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        X-Trace-ID:
          $ref: '#/components/headers/TraceId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server failure with a safe public message.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        X-Trace-ID:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OffersUnsupported:
      description: The configured storage profile has no offer projection (for example PostgreSQL). Code OFFERS_NOT_SUPPORTED.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        X-Trace-ID:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    HealthData:
      type: object
      required: [status, service, storage]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: shopsense-api
        storage:
          type: string
          enum: [sqlite, postgres]
        catalogCount: { type: integer, minimum: 0 }
        ai:
          type: object
          required: [available, provider]
          properties:
            available: { type: boolean }
            provider: { type: string, enum: [local, gemini, ollama] }
    Product:
      description: Version 1 product. Version 2 adds offer and availability in OfferProduct.
      allOf:
        - $ref: '#/components/schemas/ProductFields'
      unevaluatedProperties: false
    ProductFields:
      type: object
      required:
        [
          id,
          name,
          brand,
          category,
          priceCents,
          description,
          imageUrl,
          imageAlt,
          attributes,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        priceCents:
          type: integer
          minimum: 0
        description:
          type: string
        imageUrl:
          type: string
          description: HTTPS image URL or root-relative checked-in catalog asset path.
        imageAlt:
          type: string
        attributes:
          type: array
          items:
            type: string
        matchTags:
          type: array
          items:
            type: string
        color: { type: string, enum: [black, white, navy, red, green, blue] }
        audience: { type: string, enum: [women, men, kids, unisex] }
        productType: { type: string, maxLength: 40 }
        location:
          type: object
          required: [storeId, layoutVersion, virtual, aisle, rack, shelf]
          additionalProperties: false
          properties:
            storeId: { type: string }
            layoutVersion: { type: integer, minimum: 1 }
            virtual: { type: boolean, const: true }
            aisle: { type: string }
            rack: { type: string }
            shelf: { type: integer, minimum: 1 }
        imageCredit:
          type: object
          required: [kind, author, source, licenseUrl]
          additionalProperties: false
          properties:
            kind: { type: string, const: style-reference }
            author: { type: string, minLength: 1, maxLength: 240 }
            source: { type: string, format: uri }
            licenseUrl:
              { type: string, const: 'https://www.pexels.com/license/' }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 3
          maxLength: 240
        useAi:
          type: boolean
          default: false
          description: Request the configured server-side provider. The shopper UI sends true for every search. Omitted/false preserves API catalog-only compatibility. Failure returns labeled catalog fallback with HTTP 200.
        filters:
          type: object
          additionalProperties: false
          description: Intersect customer selections with query-derived restrictions before retrieval and AI. Conflicting requirements return no matches.
          properties:
            audience: { type: string, enum: [women, men, kids, unisex] }
            color:
              { type: string, enum: [black, white, navy, red, green, blue] }
            maximumPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
    Recommendation:
      type: object
      required: [product, matchedDetails]
      properties:
        product:
          $ref: '#/components/schemas/Product'
        matchedDetails:
          type: array
          maxItems: 4
          items:
            type: string
    SearchData:
      type: object
      required: [intentCategory, resultCount, results, summary, source]
      properties:
        intentCategory:
          type: [string, 'null']
        resultCount:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        summary:
          type: string
        source:
          type: string
        totalMatches: { type: integer, minimum: 0 }
        appliedFilters:
          type: object
          properties:
            color: { type: [string, 'null'] }
            audience: { type: [string, 'null'] }
            productType: { type: [string, 'null'] }
            categoryId: { type: [string, 'null'] }
            excludedColors: { type: array, items: { type: string } }
            minimumPriceCents: { type: [integer, 'null'] }
            maximumPriceCents: { type: [integer, 'null'] }
        assistance:
          type: object
          required: [status, provider]
          properties:
            status: { type: string, enum: [catalog, assisted, unavailable] }
            provider: { type: string, enum: [local, gemini, ollama] }
            reason:
              type: string
              enum:
                [
                  not_configured,
                  busy,
                  budget,
                  timeout,
                  quota,
                  provider_error,
                  invalid_response,
                  catalog_limit,
                ]
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [productId, helpful]
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 80
        helpful:
          type: boolean
    FeedbackData:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    Location:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9._:-]{1,80}$' }
        name: { type: string, maxLength: 120 }
    LocationList:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
    Offer:
      type: object
      additionalProperties: false
      required:
        [merchantId, sku, sourceVersion, priceCents, currency, updatedAt]
      properties:
        merchantId: { type: string }
        sku: { type: string }
        sourceVersion: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        updatedAt: { type: string, format: date-time }
    Availability:
      type: object
      additionalProperties: false
      required: [locationId, state, confirmedAt, stale]
      description: Missing records and records older than the freshness limit are reported as unknown, never as in_stock.
      properties:
        locationId: { type: string }
        state: { type: string, enum: [in_stock, out_of_stock, unknown] }
        confirmedAt: { type: [string, 'null'], format: date-time }
        stale: { type: boolean }
    OfferProduct:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - type: object
          required: [offer, availability]
          properties:
            offer:
              $ref: '#/components/schemas/Offer'
            availability:
              description: Null when the request named no store.
              oneOf:
                - $ref: '#/components/schemas/Availability'
                - type: 'null'
      unevaluatedProperties: false
    CatalogFreshness:
      type: object
      required: [state, asOf, generatedAt, maxAgeMinutes]
      properties:
        state:
          type: string
          enum: [empty, ready, stale]
          description: empty when no offer is published; stale when nothing was updated or confirmed within the limit.
        asOf: { type: [string, 'null'], format: date-time }
        generatedAt: { type: string, format: date-time }
        maxAgeMinutes: { type: integer, minimum: 1, maximum: 10080 }
    FeedStatus:
      allOf:
        - $ref: '#/components/schemas/CatalogFreshness'
        - type: object
          required: [offerCount, withdrawnCount, locationCount]
          properties:
            offerCount: { type: integer, minimum: 0 }
            withdrawnCount: { type: integer, minimum: 0 }
            locationCount: { type: integer, minimum: 0 }
    OfferPage:
      type: object
      required: [items, total, unavailableIds, catalog]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfferProduct'
        total: { type: integer, minimum: 0 }
        unavailableIds: { type: array, items: { type: string } }
        catalog:
          $ref: '#/components/schemas/CatalogFreshness'
    OfferSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 3, maxLength: 240 }
        useAi: { type: boolean, default: false }
        location:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,80}$'
          description: Store location ID. Unknown IDs are rejected with INVALID_LOCATION.
        filters:
          type: object
          additionalProperties: false
          properties:
            audience: { type: string, enum: [women, men, kids, unisex] }
            color:
              { type: string, enum: [black, white, navy, red, green, blue] }
            maximumPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
            availableOnly:
              type: boolean
              description: Only fresh in_stock records at the named store. Requires location, otherwise INVALID_SEARCH.
    Match:
      type: object
      required: [field, text]
      properties:
        field: { type: string, enum: [attributes, tags] }
        index:
          type: integer
          minimum: 0
          description: Present for attributes; the position in product.attributes.
        text: { type: string }
    OfferRecommendation:
      type: object
      required: [product, matchedDetails, matches]
      properties:
        product:
          $ref: '#/components/schemas/OfferProduct'
        matchedDetails: { type: array, maxItems: 4, items: { type: string } }
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Match'
    OfferSearchData:
      type: object
      required: [intentCategory, resultCount, results, summary, source, catalog]
      properties:
        intentCategory: { type: [string, 'null'] }
        resultCount: { type: integer, minimum: 0 }
        results:
          type: array
          items:
